<style>
:root{--pad:clamp(20px,6.95vw,120px);--line:#2a2a2a;--mute:#8a8a8a;--Mil-Spec:#4b69ff;--Restricted:#8847ff;--Classified:#d32ce6;--Covert:#eb4b4b;--Rare:#ffd700}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:#fff;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px var(--pad);background:linear-gradient(#000c,#0000)}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;color:#fff;text-decoration:none}.logo i{width:20px;height:40px;background:#fff;border-radius:0 32px 32px 0}.logo b{font-weight:700}.logo span{font-weight:400}
.top nav{display:flex;gap:clamp(12px,2.5vw,36px)}.top nav button{background:none;border:0;color:#fff;font:500 15px Poppins;cursor:pointer;padding:4px 0;border-bottom:1px solid transparent}.top nav button:hover,.top nav button.on{border-color:#fff}
.me{display:flex;align-items:center;gap:12px;font-size:14px}.me img,.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#222;display:grid;place-items:center;font-weight:600}
.btn{background:#fff;color:#000;border:1.5px solid #fff;font:500 14px Poppins;padding:9px 16px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{background:#000;color:#fff}
.btn.o{background:transparent;color:#fff;border-color:#ffffffcc}.btn.o:hover{background:#fff;color:#000}.btn:disabled{opacity:.4}
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}#scene.dragging{cursor:grabbing}
.ui{position:absolute;inset:0;pointer-events:none}.ui a,.ui button{pointer-events:auto}
.arrows{position:absolute;top:19%;right:var(--pad);display:flex;gap:20px}
.arrow{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:none;color:#fff;display:grid;place-items:center;cursor:pointer}.arrow:hover{background:#fff;color:#000}.arrow svg{width:18px;height:18px}
.tagline{position:absolute;left:var(--pad);bottom:clamp(40px,7.5vh,70px);font-size:clamp(24px,2.65vw,44px);line-height:1.2;font-weight:300}.tagline strong{display:block;font-weight:700}
.cta-row{position:absolute;left:45.6%;right:-1vw;top:88.7%;transform:translateY(-50%);display:flex;align-items:center}
.cta{flex:none;height:48px;padding:0 15px;display:inline-flex;align-items:center;border:1.5px solid #ffffffd9;border-radius:6px;color:#fff;text-decoration:none;font-size:14px;background:#00000026}.cta:hover{background:#fff;color:#000}
.cta-line{flex:1;height:1.5px;background:#fffc;min-width:40px}
.count{flex:none;font-size:clamp(140px,19.8vw,360px);line-height:1;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px #ffffffe6;transform:translateY(6%);user-select:none}
.loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.2em;opacity:.6;transition:opacity .6s}.loader.done{opacity:0}
@media(max-width:900px),(max-aspect-ratio:1/1){.tagline{bottom:clamp(150px,20vh,220px)}.cta-row{left:var(--pad);right:-3vw;top:auto;bottom:24px;transform:none}.count{font-size:clamp(120px,22vw,200px)}.arrows{top:15%}}
#app{max-width:1100px;margin:0 auto;padding:90px 24px 60px}
.tab{display:none}.tab.on{display:block}
h2{font-size:28px;font-weight:700;margin-bottom:18px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{border:1.5px solid var(--line);border-top:4px solid var(--c,var(--line));padding:14px;border-radius:6px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.card small{color:var(--mute)}.card b{font-weight:600}.price{font-weight:600}.card.sel{border-color:#fff}
.case{align-items:center;text-align:center;padding:22px 12px}.case .box{font-size:46px}
.roul{position:relative;overflow:hidden;border:1.5px solid var(--line);margin:18px 0;height:120px;display:none;border-radius:6px}.roul::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff}
.strip{display:flex;height:100%}.cell{flex:0 0 130px;border-right:1px solid var(--line);border-bottom:4px solid var(--c);padding:10px;font-size:13px;display:grid;place-items:center;text-align:center}
.up{display:grid;grid-template-columns:1fr 330px;gap:24px}@media(max-width:800px){.up{grid-template-columns:1fr}}
.wheel{position:relative;width:270px;height:270px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center}.wheel::before{content:"";position:absolute;inset:22px;background:#000;border-radius:50%}.wheel .t{position:relative;text-align:center}
.arrowp{position:absolute;inset:0;transition:transform 4.5s cubic-bezier(.12,.7,.1,1)}.arrowp::after{content:"";position:absolute;left:50%;top:-6px;margin-left:-10px;border:10px solid transparent;border-top:26px solid #fff;border-bottom:0}
.mults{display:flex;gap:8px;justify-content:center;margin:10px 0}
input[type=text],input[type=number],input[type=url]{width:100%;background:#000;border:1.5px solid var(--line);color:#fff;padding:10px 12px;border-radius:6px;font:14px Poppins;margin:6px 0 14px}
.prof{display:grid;grid-template-columns:150px 1fr;gap:28px;max-width:640px}@media(max-width:600px){.prof{grid-template-columns:1fr}}
.big{width:140px;height:140px;border-radius:50%;object-fit:cover;background:#222;display:grid;place-items:center;font-size:48px;margin-bottom:12px}
.empty{color:var(--mute);padding:24px 0}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:99}
.toast{background:#000;border:1.5px solid #fff;padding:12px 16px;min-width:240px;max-width:340px;font-size:14px;border-radius:6px;animation:in .25s}.toast.err{border-color:var(--Covert)}.toast.ok{border-color:#3be08a}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.mask{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:98;padding:16px}.mbox{background:#000;border:1.5px solid #fff;border-radius:8px;padding:22px;width:min(420px,100%);font-size:14px}
.opt{display:flex;gap:8px;margin-bottom:14px}.opt button{flex:1}.req{border:1px dashed #fff;padding:12px;margin:10px 0;word-break:break-all;font-weight:600;font-size:16px}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.arrowp{transition-duration:.01s}}

.top{padding-top:clamp(24px,4.7vh,40px)}
.top nav button{position:relative;border:0!important}
.top nav button::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s ease}
.top nav button:hover::after,.top nav button.on::after{transform:scaleX(1);transform-origin:left}
.arrows{left:76.7%;right:auto;top:18.9%;gap:32px;transform:translate(-19px,-50%)}
.arrow{transition:background .25s,color .25s}
.dots{position:absolute;right:calc(var(--pad) - 7px);top:49.4%;transform:translateY(-50%);display:flex;flex-direction:column;gap:33px}
.dot{width:14px;height:14px;padding:0;border-radius:50%;border:2px solid #fff;background:#fff;cursor:pointer;transition:background .25s}.dot.active{background:transparent}
.loader{text-transform:uppercase}.cta{font-weight:400;transition:background .25s,color .25s}
@media(max-width:900px),(max-aspect-ratio:1/1){.arrows{left:auto;right:var(--pad);top:15%;transform:translateY(-50%);gap:14px}}
@media(max-width:640px){.dots{gap:20px;right:16px}.dot{width:10px;height:10px}.cta-row{right:-8vw}.count{font-size:120px}.top nav{gap:14px}.top nav button,.logo{font-size:13px}}

:root{--f:'Manrope','Poppins',sans-serif;--fd:'Unbounded','Manrope',sans-serif}
html,body,button,input,.btn,.top nav button,.tagline{font-family:var(--f)!important}
h2,.card b,.mbox h2{font-family:var(--fd)!important;font-weight:600}
.badge{display:none;background:#fff;color:#000;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;margin-left:4px}
.cc{position:relative;align-items:center;text-align:center;padding:22px 12px 16px;cursor:pointer;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 32%,transparent),transparent 65%),#07070a;transition:transform .2s,border-color .2s}
.cc:hover{transform:translateY(-4px);border-color:var(--c)}.cc svg{filter:drop-shadow(0 8px 20px var(--c))}.cc b{font-size:13px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:52vh;overflow:auto;margin:14px 0}
.items .card{padding:10px;font-size:12px}.mbox.wide{width:min(820px,100%)}
.note{border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;font-size:14px;display:flex;justify-content:space-between;gap:12px}
.note.new{border-color:#3be08a}.note small{color:var(--mute);white-space:nowrap}

body{background:transparent}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#1a0b3a,#07040f 55%,#000)}
.bg::before{content:"";position:absolute;inset:-20%;filter:blur(30px);background:radial-gradient(circle at 20% 30%,#7c3aed66,transparent 35%),radial-gradient(circle at 80% 20%,#06b6d44d,transparent 35%),radial-gradient(circle at 60% 85%,#ec489944,transparent 40%);animation:drift 22s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%)}
@keyframes drift{to{transform:translate(4%,3%) scale(1.12) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.bg::before{animation:none}}
#app{position:relative;z-index:1}
.card{background:#0b0916b8;backdrop-filter:blur(6px)}
.sk{width:100%;height:86px;object-fit:contain;filter:drop-shadow(0 6px 14px var(--c));transition:transform .2s}.card:hover .sk{transform:scale(1.08) rotate(-3deg)}
.items .sk{height:64px}
.roul{height:160px;background:#07050f99;box-shadow:0 0 40px #7c3aed44}
.roul::before,.roul::after{z-index:2}
.roul::after{width:3px;background:linear-gradient(#22d3ee,#a855f7);box-shadow:0 0 14px #a855f7}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;background:linear-gradient(#0000,color-mix(in srgb,var(--c) 22%,transparent))}
.cell img{height:76px;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 10px var(--c))}
.up{display:flex!important;flex-direction:column;align-items:center;gap:22px}
.upR{display:flex;flex-direction:column;align-items:center;width:100%}.upL{width:100%}
.wheel{width:min(360px,82vw);height:min(360px,82vw);margin:6px auto 20px;box-shadow:0 0 70px #7c3aed77,0 0 0 6px #ffffff12,inset 0 0 30px #000}
.wheel::before{inset:28px;background:radial-gradient(circle,#17123a,#05030a);box-shadow:inset 0 0 26px #000,0 0 0 2px #ffffff26}
.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#000a 0 .7deg,transparent .7deg 3.6deg);pointer-events:none}
.arrowp{z-index:2;filter:drop-shadow(0 0 8px #fff)}
.wheel .t img{width:120px;height:90px;object-fit:contain;filter:drop-shadow(0 6px 16px #a855f7)}
.btn.go{min-width:260px;padding:13px 28px;font-weight:700;background:linear-gradient(90deg,#22d3ee,#a855f7);border:0;color:#000;box-shadow:0 0 28px #a855f777}.btn.go:hover{filter:brightness(1.15);color:#000}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:28px;max-width:640px}
.stat{border:1.5px solid var(--line);border-radius:8px;padding:14px;background:#0b0916b8}.stat small{color:var(--mute);display:block}.stat b{font:600 22px var(--fd)}

@keyframes spin{to{transform:rotate(360deg)}}@keyframes fl{50%{transform:translateY(-7px)}}@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes npulse{from{box-shadow:0 0 50px #ff2bd699,0 0 0 6px #ff2bd655,inset 0 0 30px #000}to{box-shadow:0 0 110px #00f0ffcc,0 0 0 6px #00f0ff88,inset 0 0 30px #000}}
.mbox{overflow:hidden}
.cc{padding:26px 12px 18px;gap:8px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--c) 40%,#222)}
.cc:hover{box-shadow:0 0 34px color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-6px)}
.cc svg{width:150px;height:150px;animation:fl 4s ease-in-out infinite}.cc b{font-size:14px}
.pill{background:linear-gradient(90deg,#22d3ee,#a855f7);color:#000;font-weight:800;border-radius:20px;padding:5px 16px;margin-top:4px}
.chead{display:flex;align-items:center;gap:26px;margin:18px 0;flex-wrap:wrap}#cbig svg{width:180px;height:180px;animation:fl 4s ease-in-out infinite}
.roul{display:block;height:170px;border-radius:12px;border:1.5px solid #ffffff22;background:#07050fcc;box-shadow:0 0 50px #7c3aed55;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.roul::before{content:"";position:absolute;left:50%;top:0;margin-left:-10px;border:10px solid transparent;border-top:15px solid #a855f7;filter:drop-shadow(0 0 8px #a855f7);z-index:3}
.roul::after{width:3px;background:linear-gradient(#22d3ee,#a855f7);box-shadow:0 0 16px #a855f7;z-index:2}
.cell{flex:0 0 140px;gap:4px;font-size:11px;background:linear-gradient(#0000,color-mix(in srgb,var(--c) 26%,transparent));transition:opacity .5s,transform .5s}
.cell .sk{height:84px}.cell.win{transform:scale(1.1);box-shadow:inset 0 0 36px var(--c)}.roul.done .cell:not(.win){opacity:.28}
.rev{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 0 4px;animation:pop .45s}
.rev::before{content:"";position:absolute;left:50%;top:6%;width:560px;height:560px;margin-left:-280px;background:repeating-conic-gradient(color-mix(in srgb,var(--c) 38%,transparent) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 65%);mask-image:radial-gradient(circle,#000 8%,transparent 65%);animation:spin 14s linear infinite}
.rev>*{position:relative}.rev .sk{height:200px;width:auto;max-width:100%;filter:drop-shadow(0 0 28px var(--c))}.rev h2{margin:0;font-size:18px}
.arrowp{transition:transform 5.5s cubic-bezier(.12,.7,.1,1)}
.halo{position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(#22d3ee,#a855f7,#ec4899,#22d3ee);filter:blur(16px);opacity:.6;animation:spin 9s linear infinite;z-index:-1}
.wheel.neon{animation:npulse .9s ease-in-out infinite alternate}.wheel.neon .halo{background:conic-gradient(#ff2bd6,#ffe600,#00f0ff,#ff2bd6);opacity:.95;animation-duration:2s}
.nb{display:none;font:700 24px var(--fd);letter-spacing:.25em;background:linear-gradient(90deg,#ff2bd6,#ffe600,#00f0ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;animation:pop .5s}.nb.on{display:block}

@keyframes feedIn{from{max-height:0;opacity:0;transform:translateY(-30px) scale(.8)}to{max-height:190px}}
.feed{position:fixed;left:0;top:84px;bottom:0;width:132px;z-index:6;padding:8px;background:linear-gradient(90deg,#05030ae6,#05030a66);border-right:1px solid #ffffff14;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.feed h4{margin:0 0 8px;font:700 11px var(--fd);letter-spacing:.2em;color:#ff2bd6;text-shadow:0 0 10px #ff2bd6}.feed h4::before{content:"●";margin-right:6px;animation:npulse .8s infinite alternate;box-shadow:none}
.fd{max-height:190px;overflow:hidden;margin-bottom:8px;padding:6px 4px;border-radius:10px;text-align:center;border:1px solid color-mix(in srgb,var(--c) 55%,#111);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 28%,transparent),#0b0916);animation:feedIn .7s ease-out}
.fd .sk{height:60px}.fd b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fd small{display:block;color:var(--mute);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fd em{font-style:normal;font-weight:700;font-size:11px;color:var(--c)}.fe{font-size:11px;color:var(--mute)}
@media(max-width:1180px){.feed{display:none!important}}@media(min-width:1181px){#app{padding-left:140px}}
.tos{max-height:300px;overflow:auto;font-size:13px;color:var(--mute);line-height:1.55;padding-right:8px}.tos li{margin-bottom:6px}.btn.go:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<aside class="feed" id="feed"><h4>LIVE DROP</h4><div id="feedList"><p class="fe">Тут з’являтимуться круті дропи гравців</p></div></aside>
<header class="top">
  <a href="#" class="logo" onclick="window.scrollTo({top:0,behavior:'smooth'});return false"><i></i><b>Neon</b><span>Drop</span></a>
  <nav id="nav"><button data-t="home">Головна</button><button data-t="cases">Кейси</button><button data-t="upgrade">Апгрейдер</button><button data-t="inventory">Інвентар</button><button data-t="profile">Профіль <span id="badge" class="badge"></span></button></nav>
  <div class="me" id="me"></div>
</header>

<section class="hero" id="hero">
  <canvas id="scene" aria-label="Скляний куб. Потягніть, щоб обертати."></canvas>
  <div class="ui">
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">NeonDrop</h1>
    <div class="arrows">
      <button class="arrow" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="arrow" id="next" aria-label="Далі"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <nav class="dots" aria-label="Слайди"><button class="dot" aria-label="1"></button><button class="dot active" aria-label="2"></button><button class="dot" aria-label="3"></button></nav>
    <p class="tagline">Відкривай кейси.<br>Апгрейдь. <strong>Вигравай.</strong></p>
    <div class="cta-row"><a href="#cases" class="cta" onclick="showTab('cases');return false">Відкрити кейси</a><span class="cta-line"></span><span class="count" aria-hidden="true">15</span></div>
    <div class="loader" id="loader">LOADING</div>
  </div>
</section>

<div class="bg" id="bg"></div>
<main id="app">
  <section class="tab on" id="cases"><h2>Кейси</h2><div class="grid" id="caseGrid"></div><p class="empty" id="odds"></p></section>
  <section class="tab" id="casepage"><button class="btn o" onclick="showTab('cases')">← Усі кейси</button>
    <div class="chead"><div id="cbig"></div><div><h2 id="ctitle" style="margin-bottom:6px"></h2><small id="cinfo" style="color:var(--mute)"></small><br><br><button class="btn go" id="copen"></button></div></div>
    <div class="roul" id="roul"><div class="strip" id="strip"></div></div>
    <h2 style="font-size:20px;margin:30px 0 12px">Вміст кейса</h2><div class="items" id="citems" style="max-height:none"></div></section>
  <section class="tab" id="upgrade"><h2>Апгрейдер</h2><div class="up"><div class="upR"><div class="nb" id="nb">NEONDROP</div><div class="wheel" id="wheel"><i class="halo"></i><div class="arrowp" id="arrowp"></div><div class="t"><div id="wimg"></div><b id="wch" style="font-size:30px">—</b><br><small>шанс</small></div></div><div class="mults" id="mults"></div><button class="btn go" onclick="doUpgrade()">Апгрейд</button></div>
    <div class="upL"><p class="empty">Оберіть скін зі свого інвентарю:</p><div class="grid" id="upGrid"></div></div></div></section>
  <section class="tab" id="inventory"><h2>Інвентар</h2><div class="grid" id="invGrid"></div></section>
  <section class="tab" id="profile"><h2>Профіль</h2><div id="profBox"></div></section>
</main>
<div id="toasts"></div>

<script>
const $=id=>document.getElementById(id);
let S={},selItem=null,mult=2,busy=false,shown=new Set(),muted=localStorage.getItem('mute')==='1',AC;
const RC={'Mil-Spec':'#4b69ff','Restricted':'#8847ff','Classified':'#d32ce6','Covert':'#eb4b4b','Rare Special':'#ffd700'};
